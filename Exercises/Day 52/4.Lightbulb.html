<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function on(){
            document.getElementById("light").src = "download2.JPG" ;
        }
        function off(){
            document.getElementById("light").src = "download1.JPG";
        }
    </script>
</head>
<body>

<h2>Light Switch</h2>

<img id="light" src="download1.JPG" width="200px" height="200px">

<br><br>

<button onclick="on()">ON</button>
<button onclick="off()">OFF</button>
</body>
</html>
