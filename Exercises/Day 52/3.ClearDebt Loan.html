<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearDebt Loan Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script>
      function calculateLoan() {
        let amount = parseFloat(document.getElementById("amount").value);
        let interest = parseFloat(document.getElementById("interest").value);
        let months = parseFloat(document.getElementById("tenure").value);
        interest = interest / 100 / 12;
        months = months * 12;
        if (isNaN(amount) || isNaN(interest) || isNaN(months)) {
          alert("Please enter valid numbers.");
          return;
        }
        let balance = amount;
        let monthlyInstallment =
          (amount * interest * Math.pow(1 + interest, months)) /
          (Math.pow(1 + interest, months) - 1);
        let table = document.getElementById("schedule");
        table.innerHTML = "";
        for (let i = 1; i <= months; i++) {
          let interestPayment = balance * interest;
          let principal = monthlyInstallment - interestPayment;
          let remaining = balance - principal;
          let row =
            "<tr><td>" +
            i +
            "</td><td>" +
            balance.toFixed(2) +
            "</td><td>" +
            monthlyInstallment.toFixed(2) +
            "</td><td>" +
            principal.toFixed(2) +
            "</td><td>" +
            interestPayment.toFixed(2) +
            "</td><td>" +
            remaining.toFixed(2) +
            "</td></tr>";
          table.innerHTML += row;
          balance = remaining;
        }
      }
    </script>
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <h2 class="text-center">ClearDebt Loan Calculator</h2>
      <div class="card p-4">
        <table>
          <tr>
            <th>Amount</th>
            <td>
              <input type="text" id="amount" placeholder="Enter amount" />
            </td>
          </tr>

          <tr>
            <th>Interest Rate</th>
            <td>
              <input
                type="text"
                id="interest"
                placeholder="Enter interest rate"
              />
            </td>
          </tr>

          <tr>
            <th>Tenure</th>
            <td>
              <input
                type="text"
                id="tenure"
                placeholder="Enter tenure in years"
              />
            </td>
          </tr>

          <tr>
            <td class="text-center">
              <button onclick="calculateLoan()">Calculate</button>
            </td>
          </tr>
        </table>
      </div>
      <br />
      <table class="table table-bordered table-striped text-center">
        <thead>
          <tr>
            <th>SNO</th>
            <th>Loan Left</th>
            <th>EMI</th>
            <th>Principal</th>
            <th>Interest</th>
            <th>Remaining Balance</th>
          </tr>
        </thead>
        <tbody id="schedule"></tbody>
      </table>
    </div>
  </body>
</html>
