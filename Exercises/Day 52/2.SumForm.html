<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function sum(){
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;
            let box1 = document.getElementById("num1");
            let box2 = document.getElementById("num2");
            let result = document.getElementById("result");
            if (num1 == "" || num2 == "") {
                if(num1 == "") {
                    box1.style.backgroundColor = "red";
                }
                if(num2 == "") {
                    box2.style.backgroundColor = "red";
                }
                result.style.backgroundColor = "Orange";
                result.value = "Error";
                return;
            }
            if (isNaN(num1) || isNaN(num2)) {
                if(isNaN(num1)) {
                    box1.style.backgroundColor = "yellow";
                }
                if(isNaN(num2)) {
                    box2.style.backgroundColor = "yellow";
                }
                result.value = "Error";
                result.style.backgroundColor = "Orange";
                return;
            }
            box1.style.backgroundColor = "white";
            box2.style.backgroundColor = "white";
            result.value = parseFloat(num1) + parseFloat(num2);
            result.style.backgroundColor = "white";
        }
    </script>
</head>
<body>
    <input type="text" id="num1" placeholder="Enter first number" >
    <input type="text" id="num2" placeholder="Enter second number" onblur="sum()">
    <input type="text" value="=" size="1" readonly>
    <input type="text" id = "result" readonly>
    <!-- <button onclick="sum()">Sum</button> -->
</body>
</html>
